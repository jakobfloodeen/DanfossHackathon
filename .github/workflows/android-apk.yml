# Builds the Android app (mobile/) into an installable .apk on every push that touches the
# website or the app, and on demand (Actions tab → "Build Android APK" → Run workflow).
#
# Where to get the APK afterwards:
#   • Releases → "Android app (latest build)" → app-debug.apk   (easiest: open on the phone and install)
#   • or the run's page → Artifacts → ci-assistant-apk (a zip, needs a GitHub login)
#
# Optional: Settings → Secrets and variables → Actions → Variables → BACKEND_URL
#   (e.g. https://your-backend.onrender.com) = backend address the app starts with.
name: Build Android APK

on:
  push:
    paths:
      - "DanfossHackathon/frontend/**"
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm ci

      - name: Copy the website into the app
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run sync

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ci-assistant-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as "latest build" release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TAG=android-latest-${GITHUB_REF_NAME//\//-}
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Android app (latest build, ${GITHUB_REF_NAME})" \
            --notes "Debug APK built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On the phone: open this page, download app-debug.apk, allow 'install unknown apps' for your browser, install."
