<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competitor Intelligence Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-title">Competitor Intelligence Assistant</div>
        <div class="brand-sub">Valve &amp; Pump Solutions · prototype</div>
      </div>
    </div>
    <ol class="stepper" id="stepper" aria-label="Progress"></ol>
    <div class="top-actions">
      <button class="btn btn-ghost" id="btn-upload" type="button">Upload data</button>
      <button class="btn btn-ghost" id="btn-restart" type="button">New comparison</button>
    </div>
  </header>

  <div class="layout">
    <main class="chat-panel">
      <div class="chat-scroll" id="chat" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="composer-input" type="text"
               placeholder="Type your question… e.g. “Which competitor valve fits a tractor loader at 120 L/min?”">
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </main>
    <aside class="brief" id="brief" aria-label="Comparison brief"></aside>
  </div>

  <dialog id="upload-dialog" aria-label="Upload data"></dialog>

  <!-- Load order matters: config → mock data → API layer → UI -->
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
