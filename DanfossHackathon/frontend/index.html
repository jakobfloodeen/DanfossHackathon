<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dani · Competitor Intelligence Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-title">Dani</div>
        <div class="brand-sub">Competitor intelligence · Valve &amp; Pump Solutions</div>
      </div>
    </div>
    <nav class="modes" aria-label="What do you want to do?">
      <button class="mode" id="btn-compare" type="button" title="Start from a Danfoss product and compare it with competitor products">Compare</button>
      <button class="mode" id="btn-match" type="button" title="The customer uses a competitor product: find the closest Danfoss products">Match</button>
      <button class="mode" id="btn-system" type="button" title="Compare a system: a set of components (e.g. pump + valve) against the other side's set">System</button>
    </nav>
    <ol class="stepper" id="stepper" aria-label="Progress"></ol>
    <div class="top-actions">
      <button class="btn btn-ghost btn-sm" id="btn-upload" type="button">Upload data</button>
      <button class="btn btn-ghost btn-sm" id="btn-restart" type="button" title="Start a new comparison">New</button>
    </div>
  </header>

  <div class="layout">
    <main class="chat-panel">
      <div class="chat-scroll" id="chat" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="composer-input" type="text" data-voice
               placeholder="Ask Dani about the datasheets, e.g. “Which competitor valve fits a tractor loader at 120 L/min?”">
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </main>
    <aside class="brief" id="brief" aria-label="Comparison brief"></aside>
  </div>

  <dialog id="upload-dialog" aria-label="Upload data"></dialog>
  <dialog id="match-dialog" aria-label="Find Danfoss match"></dialog>
  <dialog id="system-dialog" aria-label="Compare system"></dialog>

  <!-- Load order matters: config → app glue → mock data → API layer → voice in/out → UI -->
  <script src="js/config.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
